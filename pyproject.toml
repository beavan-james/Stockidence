[project]
name = "stockidence"
version = "0.1.0"
description = "Stock confidence rating pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]