[project]
name = "stockidence"
version = "0.1.0"
description = "Stock confidence rating pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.9,<2.0",
    "dagster-graphql>=1.13.18",
    "dagster-webserver>=1.13.18",
    "duckdb>=1.0",
    "fastapi>=0.115",
    "grpcio==1.71.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
    # ML stack for the quarterly retrain (build_dataset + ranking notebook).
    # Pinned floors match the versions validated locally.
    "pandas>=2.0",
    "pyarrow>=15.0",
    "scipy>=1.12",
    "xgboost>=2.0",
    "nbformat>=5.9",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "jupyter_client>=8.6",
    "trafilatura>=2.0",
    "tokenizers>=0.21",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=8.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs Dagster jobs or several warehouse layers end to end (CI runs these after the unit tests)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["Model/notebooks"]

[tool.ruff.lint]
# Ruff's default rule set, minus two rules that fight deliberate patterns:
ignore = [
    # The API, the failure sensor and the backfill script catch everything on
    # purpose, so a failed read degrades to an empty response instead of a 500.
    "BLE001",
    # Regex alternations are joined from commented pieces, which an f-string
    # would lose.
    "FLY002",
]

[tool.mypy]
python_version = "3.12"
files = ["src/stockidence"]
ignore_missing_imports = true

[tool.dagster]
module_name = "stockidence.definitions"
