[project]
name = "stockidence"
version = "0.1.0"
description = "Stock confidence rating pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.9,<2.0",
    "dagster-graphql>=1.13.18",
    "dagster-webserver>=1.13.18",
    "duckdb>=1.0",
    "fastapi>=0.115",
    "grpcio==1.71.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
    # ML stack for the quarterly retrain (build_dataset + ranking notebook).
    # Pinned floors match the versions validated locally.
    "pandas>=2.0",
    "pyarrow>=15.0",
    "scipy>=1.12",
    "xgboost>=2.0",
    "nbformat>=5.9",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "jupyter_client>=8.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.dagster]
module_name = "stockidence.definitions"
