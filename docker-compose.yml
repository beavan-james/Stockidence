# Single-box production stack: FastAPI + Dagster + static SPA.
# Secrets come from .env (see .env.example) — never baked into images.
#
# DuckDB is single-writer by design: api, webserver and daemon all mount
# ./data, and every reader already retries on lock contention. The api runs
# one uvicorn worker (in-memory refresh cooldown assumes a single process).

services:
  api:
    build: .
    image: stockidence-backend:latest
    command: uvicorn stockidence.api.app:app --host 0.0.0.0 --port 8000 --workers 1
    env_file:
      - .env
    environment:
      DAGSTER_WEB_URL: http://dagster-webserver:3000
      STOCKIDENCE_DB: /app/data/stockidence.duckdb
    volumes:
      - ./data:/app/data
    depends_on:
      - dagster-webserver
    restart: unless-stopped

  # Long-lived code server: loads stockidence.definitions once and serves
  # it to the webserver and daemon over gRPC. Runs launched by the daemon
  # execute in this container, so it carries the same data/home volumes.
  dagster-code:
    build: .
    image: stockidence-backend:latest
    command: dagster code-server start -m stockidence.definitions -h 0.0.0.0 -p 4000 --location-name stockidence
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /app/dagster_home
      STOCKIDENCE_DB: /app/data/stockidence.duckdb
    volumes:
      - ./data:/app/data
      - ./dagster_home:/app/dagster_home
    restart: unless-stopped

  dagster-webserver:
    build: .
    image: stockidence-backend:latest
    command: dagster-webserver -w /app/workspace.docker.yaml -h 0.0.0.0 -p 3000
    depends_on:
      - dagster-code
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /app/dagster_home
      STOCKIDENCE_DB: /app/data/stockidence.duckdb
    volumes:
      - ./data:/app/data
      - ./dagster_home:/app/dagster_home
    # Admin UI on localhost only; reach it via SSH tunnel, not the open internet.
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  dagster-daemon:
    build: .
    image: stockidence-backend:latest
    command: dagster-daemon run -w /app/workspace.docker.yaml
    depends_on:
      - dagster-code
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /app/dagster_home
      STOCKIDENCE_DB: /app/data/stockidence.duckdb
    volumes:
      - ./data:/app/data
      - ./dagster_home:/app/dagster_home
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: ./frontend-react/Dockerfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443"
    volumes:
      # Mounted (not baked) so nginx tweaks apply without a rebuild.
      - ./frontend-react/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot-www:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped
