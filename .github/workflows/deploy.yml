# Deploy to the production box on push to main (plus manual dispatch).
#
# One-time setup:
#   1. Provision the box (Ubuntu 24.04, 2 OCPU / 12 GB), install Docker +
#      Compose plugin.
#   2. Clone the repo (read-only deploy key is enough) and create .env
#      from .env.example with real provider keys.
#   3. First boot + data load manually, then every push to main redeploys.
#   4. Add these repo secrets (Settings → Secrets → Actions):
#        SSH_HOST         public hostname/IP of the box
#        SSH_USER         SSH user (e.g. ubuntu)
#        SSH_KEY          private key with access to the box
#        PROJECT_DIR      (optional) repo path on the box; default ~/Stockidence
#
# Safety notes: data/ is a mounted volume and gitignored, so `git reset`
# never touches the warehouse; .env is untracked so keys survive deploys.
# Take a volume backup before enabling this if the warehouse matters.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${PROJECT_DIR:-~/Stockidence}"
            git fetch origin
            git reset --hard origin/main
            docker compose up --build -d
            sleep 20
            curl -sf http://localhost/api/health
            docker compose ps
        env:
          PROJECT_DIR: ${{ secrets.PROJECT_DIR }}
