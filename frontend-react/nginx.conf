# SPA on / with same-origin /api proxy (no CORS involved).
# Port 80 serves ACME challenges + redirects everything else to HTTPS.
server {
    listen 80;
    server_name stockidence.com www.stockidence.com;

    # ACME challenges for certbot (shared volume, see compose).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.stockidence.com;

    ssl_certificate /etc/letsencrypt/live/stockidence.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stockidence.com/privkey.pem;

    return 301 https://stockidence.com$request_uri;
}

server {
    listen 443 ssl;
    server_name stockidence.com;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/stockidence.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stockidence.com/privkey.pem;

    # API + docs through to FastAPI. The resolver + variable force
    # re-resolution of the `api` hostname every 10s: without this, nginx
    # pins the backend IP from its own startup and 502s after any api
    # container recreate until this container restarts too.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream api;
    location /api/ {
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    # Vite fingerprints everything under /assets/ (name + content hash), so a
    # changed file always gets a new URL: cache it for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html and unhashed public files (favicon) must be revalidated on
    # every load, or browsers keep serving the old page after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router fallback.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
